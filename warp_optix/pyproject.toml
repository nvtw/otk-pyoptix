[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_optix"
version = "0.1.0"
description = "Warp + OptiX integration helpers (otk-pyoptix addon)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{name = "NVIDIA"}]
dependencies = [
    "warp-lang>=1.17",
]

[project.optional-dependencies]
optix = [
    "pyoptix>=9.1",
]
training = [
    "warp-nn>=0.3.1",
]
pathtracing = [
    "imageio>=2.31",
    "Pillow>=9",
    "pyglet>=2.1,<3",
]
usd = [
    "usd-core>=25.5,<26.5; platform_machine != 'aarch64' and python_version < '3.14'",
    "usd-exchange>=2.2.0; platform_machine == 'aarch64' and python_version < '3.13'",
]
recording = [
    "imageio>=2.31",
]
ui = [
    "imgui-bundle>=1.92",
    "PyOpenGL>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warp_optix*"]

[tool.setuptools.package-data]
"warp_optix" = ["_native/include/*.h"]
