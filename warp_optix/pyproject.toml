[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warp_optix"
version = "0.1.0"
description = "Warp + OptiX integration helpers (otk-pyoptix addon)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "NVIDIA"}]
dependencies = [
    "warp-lang>=1.15",
    "pyoptix>=9.1",
    "numpy",
]

[project.optional-dependencies]
pathtracing = [
    "imageio>=2.31",
    "Pillow>=9",
    "pyglet>=2.1,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warp_optix*"]

[tool.setuptools.package-data]
"warp_optix" = ["_native/include/*.h"]
