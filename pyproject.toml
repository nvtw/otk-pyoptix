[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=2.13.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "warp-optix"
version = "0.2.0"
description = "Warp ray tracing with bundled OptiX bindings and DLSS Ray Reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE.txt", "LICENSE-APACHE.txt", "OptiX_LICENSE.txt"]
authors = [
    {name = "R. Keith Morley", email = "kmorley@nvidia.com"},
]
keywords = ["optix", "ray-tracing", "nvidia", "cuda", "gpu", "rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = ["warp-lang>=1.17", "numpy>=1.20"]

[project.optional-dependencies]
training = ["warp-nn>=0.3.1"]
pathtracing = ["imageio>=2.31", "Pillow>=9", "pyglet>=2.1,<3"]
usd = [
    "usd-core>=25.5,<26.5; platform_machine != 'aarch64' and python_version < '3.14'",
    "usd-exchange>=2.2.0; platform_machine == 'aarch64' and python_version < '3.13'",
]
recording = ["imageio>=2.31"]
ui = ["imgui-bundle>=1.92", "PyOpenGL>=3.1"]

[project.urls]
Homepage = "https://github.com/NVIDIA/warp-optix"
Documentation = "https://github.com/NVIDIA/warp-optix/blob/develop/README.md"
Repository = "https://github.com/NVIDIA/warp-optix"
Issues = "https://github.com/NVIDIA/warp-optix/issues"

[dependency-groups]
test = [
    "pytest>=7.0",
]
examples = [
    "cupy-cuda12x>=13",
    "numpy>=1.20",
    "Pillow>=9.0",
    "cuda-python>=11.0",
]
dev = [
    {include-group = "test"},
    {include-group = "examples"},
    "build",
    "twine",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/unified/{wheel_tag}"
cmake.version = ">=3.17"
cmake.build-type = "Release"
ninja.version = ">=1.11"
wheel.packages = ["warp_optix/warp_optix"]
sdist.exclude = [".claude", "env", "build", "dist", "third_party", "**/*.egg-info", "**/.pytest_cache"]

[tool.pytest.ini_options]
testpaths = ["warp_optix/tests"]
python_files = "test_*.py"
