[build-system]
requires = [
    "scikit-build-core>=0.12",
    "pybind11>=3.0,<4",
]
build-backend = "scikit_build_core.build"

[project]
name = "warp-optix"
version = "0.2.0"
description = "Warp ray tracing with PyOptiX and supplemental DLSS bindings"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND BSD-3-Clause AND LicenseRef-NVIDIA-OptiX AND LicenseRef-NVIDIA-RTX-SDK"
license-files = ["LICENSE.txt", "LICENSE-APACHE.txt", "OptiX_LICENSE.txt", "DLSS_LICENSE.txt", "THIRD_PARTY_NOTICES.txt", "licenses/*.txt"]
authors = [
    {name = "R. Keith Morley", email = "kmorley@nvidia.com"},
]
keywords = ["optix", "ray-tracing", "nvidia", "cuda", "gpu", "rendering"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]

dependencies = ["pyoptix==9.1.0", "warp-lang>=1.17", "numpy>=1.20"]

[project.optional-dependencies]
training = ["warp-nn>=0.3.1"]
pathtracing = ["imageio>=2.31", "Pillow>=9", "pyglet>=2.1,<3"]
usd = [
    "usd-core>=25.5,<26.5; platform_machine != 'aarch64' and python_version < '3.14'",
    "usd-exchange>=2.2.0; platform_machine == 'aarch64' and python_version < '3.13'",
]
ui = ["imgui-bundle>=1.92", "PyOpenGL>=3.1"]

[project.urls]
Homepage = "https://github.com/NVIDIA/warp-optix"
Documentation = "https://github.com/NVIDIA/warp-optix/blob/develop/README.md"
Repository = "https://github.com/NVIDIA/warp-optix"
Issues = "https://github.com/NVIDIA/warp-optix/issues"

[dependency-groups]
test = [
    "pytest>=7.0",
]
dev = [
    {include-group = "test"},
    "build",
    "twine",
]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/extensions/{wheel_tag}"
cmake.version = ">=3.17"
cmake.build-type = "Release"
ninja.version = ">=1.11"
wheel.packages = ["warp_optix/warp_optix"]
sdist.exclude = [
    ".claude", ".agents", ".codex", ".aws", ".venv", "env", "build", "dist",
    "third_party", "*.bmp", "**/*.egg-info", "**/.pytest_cache",
]

[tool.pytest.ini_options]
testpaths = ["warp_optix/tests"]
python_files = "test_*.py"
markers = [
    "gpu: requires a CUDA GPU with an OptiX-capable driver",
    "slow: long-running test",
    "usd: requires the usd optional dependencies",
    "render: renders images and compares them against references",
    "training: requires the training extra (warp-nn)",
]

# Match Warp's Python formatting conventions.
[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
